<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower of Life Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: radial-gradient(circle at center, #05192d 0%, #020610 60%, #000 100%); }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const phi = (1 + Math.sqrt(5)) / 2;

    function resize() {
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    window.addEventListener('resize', resize);
    resize();

    function drawFlower(cx, cy, radius, rotation) {
      const positions = [];
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i + rotation;
        positions.push({ x: cx + Math.cos(angle) * radius, y: cy + Math.sin(angle) * radius });
      }
      positions.unshift({ x: cx, y: cy });

      ctx.lineWidth = 1.8;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.shadowColor = 'rgba(96, 219, 255, 0.2)';
      ctx.shadowBlur = 14;

      positions.forEach(pos => {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.shadowBlur = 0;
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = 'rgba(204, 255, 255, 0.85)';
      ctx.beginPath();
      positions.forEach((pos, idx) => {
        if (idx === 0) return;
        ctx.moveTo(cx, cy);
        ctx.lineTo(pos.x, pos.y);
      });
      ctx.stroke();
    }

    function drawExtras(cx, cy, radius, rotation) {
      const inner = radius * 0.56;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(117, 177, 255, 0.35)';
      for (let i = 0; i < 12; i++) {
        const angle = (Math.PI / 6) * i + rotation * 0.75;
        const x = cx + Math.cos(angle) * inner;
        const y = cy + Math.sin(angle) * inner;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.42, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function animate(time) {
      const t = time * 0.00012;
      const width = canvas.width / devicePixelRatio;
      const height = canvas.height / devicePixelRatio;
      const size = Math.min(width, height);
      const centerX = width / 2;
      const centerY = height / 2;
      const baseRadius = size * 0.12;
      const ring = baseRadius * 1.12;

      ctx.clearRect(0, 0, width, height);
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(t * 0.45);
      ctx.translate(-centerX, -centerY);

      drawFlower(centerX, centerY, ring, t);
      drawExtras(centerX, centerY, ring, -t * 0.9);

      ctx.restore();

      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(3, 18, 42, ${0.08 + 0.03 * Math.sin(time * 0.002)})`;
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
