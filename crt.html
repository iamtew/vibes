<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRT Noise Stack</title>
  <style>
    /* Base page */
    html, body {
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:#000;
      overflow:hidden;
    }

    /* 1. Noise pulse */
    .noise {
      position:fixed;
      inset:0;
      background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCQAAAAA3bvkkAAAADUlEQVQIHWP4////fwAJ+wP9pukdWQAAAABJRU5ErkJggg==");
      background-size:200px;
      opacity:0.05;
      animation:pulse 4s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity:0.12; }
    }

    /* 2. Chromatic smear */
    .smear {
      position:fixed;
      inset:0;
      pointer-events:none;
      mix-blend-mode:screen;
      background:
        radial-gradient(circle at 30% 40%, rgba(255,0,0,0.12), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(0,128,255,0.12), transparent 60%);
      animation:smearShift 14s ease-in-out infinite alternate;
    }

    @keyframes smearShift {
      0%   { transform: translateX(-8px) translateY(-4px); }
      100% { transform: translateX(8px)  translateY(4px); }
    }

    /* 3. Scanline drift */
    .scanlines {
      position:fixed;
      inset:0;
      pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04) 0px,
        rgba(255,255,255,0.04) 2px,
        transparent 2px,
        transparent 4px
      );
      animation:drift 18s linear infinite;
    }

    @keyframes drift {
      to { transform: translateY(4px); }
    }

    /* 4. Vignette */
    .vignette {
      position:fixed;
      inset:0;
      pointer-events:none;
      background:radial-gradient(
        circle at 50% 50%,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.55) 90%
      );
      mix-blend-mode:multiply;
    }

    /* Optional content layer for testing */
    .content {
      position:relative;
      z-index:10;
      color:#fff;
      font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align:center;
      top:50%;
      transform:translateY(-50%);
      letter-spacing:0.2em;
      text-transform:uppercase;
      font-size:14px;
      opacity:0.7;
    }
  </style>
</head>
<body>
  <!-- Layer order: base → smear → scanlines → vignette -->
  <div class="noise"></div>
  <div class="smear"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="content">CRT BACKGROUND ACTIVE</div>
</body>
</html>
