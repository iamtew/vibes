<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Spot Smoke</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="preview-backdrop"></div>
  <canvas id="smoke-canvas"></canvas>
  <canvas id="overlay-canvas"></canvas>

  <!-- Settings panel -->
  <div id="settings-menu">
    <div class="menu-header">
      <h2>Spot Smoke</h2>
      <div class="menu-header-buttons">
        <button id="help-button" aria-label="Show setup guide" aria-haspopup="dialog">?</button>
        <button id="flip-side-button" aria-label="Move menu to other side">⇄</button>
        <button id="close-menu-button" aria-label="Close settings">✕</button>
      </div>
    </div>

    <p class="hint">Double-click the background to set the smoke spot.</p>

    <div class="setting-group">
      <button id="color-toggle" class="setting-toggle" type="button" aria-expanded="false" aria-controls="color-controls">Smoke color <span id="color-toggle-icon" aria-hidden="true">∇</span></button>
      <div id="color-controls" hidden>
        <div id="color-picker" aria-label="Smoke color picker"></div>
        <div class="row">
          <input id="color-input" type="text" inputmode="text" maxlength="7" spellcheck="false" aria-label="Smoke color hex value" />
          <button id="color-reset-button" class="small-button">Reset ඞ</button>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="size-slider"><span>Size</span></label>
          <div class="range-row">
            <input id="size-slider" type="range" min="0.25" max="4" step="0.05" />
          </div>
        </div>
        <span class="value-label" id="size-value"></span>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="duration-slider"><span>Duration (s)</span></label>
          <div class="range-row">
            <input id="duration-slider" type="range" min="1" max="60" step="1" />
          </div>
        </div>
        <span class="value-label" id="duration-value"></span>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="intensity-slider"><span>Intensity</span></label>
          <div class="range-row">
            <input id="intensity-slider" type="range" min="1" max="10" step="1" />
          </div>
        </div>
        <span class="value-label" id="intensity-value"></span>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="lifetime-slider"><span>Lifetime (s)</span></label>
          <div class="range-row">
            <input id="lifetime-slider" type="range" min="1" max="60" step="1" />
          </div>
        </div>
        <span class="value-label" id="lifetime-value"></span>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="width-slider"><span>Width (px)</span></label>
          <div class="range-row">
            <input id="width-slider" type="range" min="0" max="400" step="5" />
          </div>
        </div>
        <span class="value-label" id="width-value"></span>
      </div>
    </div>

    <div class="setting-group">
      <div class="range-control">
        <div class="range-details">
          <label for="turbulence-slider"><span>Turbulence</span></label>
          <div class="range-row">
            <input id="turbulence-slider" type="range" min="0" max="100" step="1" />
          </div>
        </div>
        <span class="value-label" id="turbulence-value"></span>
      </div>
    </div>

    <button id="test-button">Test smoke</button>
    <button id="reset-button">Reset all ඞ</button>

    <div class="setting-group">
      <button id="copy-url-button" class="small-button">Copy URL</button>
      <button id="copy-url-obs-button" class="small-button">Copy URL for OBS</button>
    </div>
  </div>

  <div id="help-overlay" role="dialog" aria-modal="true" aria-label="Spot Smoke setup guide" hidden>
    <button id="help-close-button" aria-label="Close setup guide">✕</button>
    <img id="help-image" src="spotsmoke-howto.jpg" alt="Spot Smoke setup guide" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
  <script src="app.js"></script>
</body>
</html>
