<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibes by tew</title>
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/source-code-pro">
  <link rel="stylesheet" href="style.css">

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
</head>

<body>
  <div id="content"></div>

  <!-- Marked.js Markdown parser.  -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    function renderText(text) {
      // Render markdown into the content div
      document.getElementById('content').innerHTML = marked.parse(text);
    }

    function loadFallback() {
      document.getElementById('content').innerHTML =
        '<h1>README not found</h1><p>System says: 404, but your markdown is the real missing dependency.</p>';
    }

    fetch('README.md')
      .then(response => response.ok ? response.text() : Promise.reject())
      .then(text => renderText(text))
      .catch(loadFallback);
  </script>
</body>

</html>
